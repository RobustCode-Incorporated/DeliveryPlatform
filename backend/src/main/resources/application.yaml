spring:
  application:
    name: delivery-platform

  datasource:
    url: jdbc:mysql://localhost:3306/delivery_db
    username: delivery_user
    password: delivery_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

server:
  port: 8080