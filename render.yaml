services:
  - type: web
    name: robust-delivery-platform-backend
    env: java
    rootDir: backend
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dspring.profiles.active=neon -jar target/robust-delivery-platform-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: NEON_JDBC_URL
        sync: false
      - key: NEON_DB_USERNAME
        sync: false
      - key: NEON_DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: robust-delivery-platform-frontend
          property: url

  - type: web
    name: robust-delivery-platform-frontend
    env: static
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: robust-delivery-platform-backend
          property: url
